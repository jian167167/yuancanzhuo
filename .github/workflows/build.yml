name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（无签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project ScrcpyRemote.xcodeproj \
            -scheme ScrcpyRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build

      - name: 打包 IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ScrcpyRemote.app"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ScrcpyRemote.ipa Payload
          ls -lh ScrcpyRemote.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-ipa
          path: ScrcpyRemote.ipa
          if-no-files-found: error
