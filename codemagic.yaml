workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ScrcpyRemote.xcodeproj"
        XCODE_SCHEME: "ScrcpyRemote"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la
      - name: Build without signing
        script: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build
      - name: Package IPA
        script: |
          APP="build/Build/Products/Release-iphoneos/ScrcpyRemote.app"
          ls -la "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ScrcpyRemote.ipa Payload
          ls -lh ScrcpyRemote.ipa
    artifacts:
      - ScrcpyRemote.ipa
